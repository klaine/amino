<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amino harness</title>
<style>
  :root { color-scheme: dark; --bg: #0a0d10; --line: #2a333b; --text: #dde5ea; --dim: #8796a0; --accent: #6fe0bf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar strong { letter-spacing: .12em; font-size: 12px; }
  .bar .dim { color: var(--dim); }
  button, select { background: #182027; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .frame { flex: 1; display: flex; justify-content: center; min-height: 0; background: #06080a; }
  iframe { border: 0; width: 100%; height: 100%; background: #0d1116; }
  .keys { display: flex; height: 74px; padding: 6px 12px 10px; border-top: 1px solid var(--line); gap: 0; user-select: none; touch-action: none; }
  .key { position: relative; flex: 1; border: 1px solid #333; border-radius: 0 0 4px 4px; background: #d9dee2; color: #445; font-size: 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; }
  .key.black { background: #1a1f24; color: #889; flex: .7; margin: 0 -2.5%; z-index: 1; height: 62%; }
  .key.down { background: var(--accent); }
  .meter { width: 90px; height: 6px; background: #182027; border-radius: 3px; overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0; background: var(--accent); }
</style>
</head>
<body>
<div class="bar">
  <strong>AMINO HARNESS</strong>
  <label class="dim">Width
    <select id="width">
      <option value="100%">Full</option><option value="1280px">1280</option>
      <option value="768px">Tablet 768</option><option value="390px">Phone 390</option>
    </select>
  </label>
  <button id="audio">Audio off</button>
  <span class="meter" title="Output level"><i id="meter"></i></span>
  <label class="dim">Octave <select id="octave"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
  <span class="dim">Keys: A W S E D F T G Y H U J K · Z/X octave</span>
</div>
<div class="frame">
  <!-- Same sandbox as schwung-manager's Remote UI iframe. -->
  <iframe id="ui" sandbox="allow-scripts allow-same-origin" title="Amino Remote UI"></iframe>
</div>
<div class="keys" id="keys"></div>
<script>
const ui = document.getElementById("ui");
function load() {
  ui.style.width = document.getElementById("width").value;
  ui.src = "/remote-ui/amino/web_ui.html?component=synth";
}
document.getElementById("width").onchange = () => { ui.style.width = document.getElementById("width").value; };
load();

/* ---- MIDI */
const midi = (msg) => fetch("/api/midi", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ msg }) });
const down = new Set();
const octaveSel = document.getElementById("octave");
const baseNote = () => 12 * (Number(octaveSel.value) + 1);
function noteOn(n, vel = 100) { if (down.has(n)) return; down.add(n); midi([0x90, n, vel]); paint(); }
function noteOff(n) { if (!down.delete(n)) return; midi([0x80, n, 0]); paint(); }

const keysEl = document.getElementById("keys");
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const keyEls = [];
for (let i = 0; i < 25; i++) {
  const el = document.createElement("div");
  const black = [1, 3, 6, 8, 10].includes(i % 12);
  el.className = "key" + (black ? " black" : "");
  el.textContent = black ? "" : NAMES[i % 12];
  el.dataset.offset = String(i);
  el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); noteOn(baseNote() + i, Math.round(40 + 87 * (e.offsetY / el.clientHeight))); });
  el.addEventListener("pointerup", () => noteOff(baseNote() + i));
  el.addEventListener("pointercancel", () => noteOff(baseNote() + i));
  keysEl.appendChild(el); keyEls.push(el);
}
function paint() { keyEls.forEach((el, i) => el.classList.toggle("down", down.has(baseNote() + i))); }

const KEYMAP = "awsedftgyhujk";
window.addEventListener("keydown", (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === "z" || k === "x") {
    const o = Number(octaveSel.value) + (k === "z" ? -1 : 1);
    if (o >= 2 && o <= 5) { [...down].forEach(noteOff); octaveSel.value = String(o); }
    return;
  }
  const i = KEYMAP.indexOf(k);
  if (i >= 0) noteOn(baseNote() + i);
});
window.addEventListener("keyup", (e) => {
  const i = KEYMAP.indexOf(e.key.toLowerCase());
  if (i >= 0) noteOff(baseNote() + i);
});
window.addEventListener("blur", () => [...down].forEach(noteOff));

/* ---- audio: raw s16le stereo 44.1 kHz from /api/audio into a worklet ring */
const WORKLET = `
class Ring extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = new Float32Array(44100 * 2); this.r = 0; this.w = 0; this.n = 0; this.peak = 0; this.t = 0;
    this.port.onmessage = (e) => {
      const d = e.data;
      for (let i = 0; i < d.length; i++) {
        if (this.n >= this.buf.length) { this.r = (this.r + 2) % this.buf.length; this.n -= 2; }
        this.buf[this.w] = d[i]; this.w = (this.w + 1) % this.buf.length; this.n++;
      }
    };
  }
  process(_in, out) {
    const l = out[0][0], r = out[0][1];
    for (let i = 0; i < l.length; i++) {
      if (this.n >= 2) {
        l[i] = this.buf[this.r]; r[i] = this.buf[(this.r + 1) % this.buf.length];
        this.r = (this.r + 2) % this.buf.length; this.n -= 2;
        this.peak = Math.max(this.peak, Math.abs(l[i]), Math.abs(r[i]));
      } else { l[i] = r[i] = 0; }
    }
    if (++this.t >= 16) { this.port.postMessage(this.peak); this.peak = 0; this.t = 0; }
    return true;
  }
}
registerProcessor("ring", Ring);`;
let audio = null;
const audioBtn = document.getElementById("audio");
const meter = document.getElementById("meter");
audioBtn.onclick = async () => {
  if (audio) {
    audio.abort.abort(); audio.ctx.close(); audio = null;
    audioBtn.textContent = "Audio off"; audioBtn.classList.remove("on"); meter.style.width = "0";
    return;
  }
  const ctx = new AudioContext({ sampleRate: 44100 });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  const node = new AudioWorkletNode(ctx, "ring", { outputChannelCount: [2] });
  node.connect(ctx.destination);
  node.port.onmessage = (e) => { meter.style.width = Math.min(100, e.data * 100) + "%"; };
  const abort = new AbortController();
  audio = { ctx, abort };
  audioBtn.textContent = "Audio on"; audioBtn.classList.add("on");
  try {
    const res = await fetch("/api/audio", { signal: abort.signal });
    const reader = res.body.getReader();
    let carry = new Uint8Array(0);
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      const bytes = new Uint8Array(carry.length + value.length);
      bytes.set(carry); bytes.set(value, carry.length);
      const usable = bytes.length - (bytes.length % 2);
      const s16 = new Int16Array(bytes.buffer, 0, usable / 2);
      const f32 = new Float32Array(s16.length);
      for (let i = 0; i < s16.length; i++) f32[i] = s16[i] / 32768;
      node.port.postMessage(f32, [f32.buffer]);
      carry = bytes.slice(usable);
    }
  } catch (err) {
    if (err.name !== "AbortError") console.error(err);
  }
};
</script>
</body>
</html>
